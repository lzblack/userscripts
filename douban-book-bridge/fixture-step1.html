<!doctype html>
<!-- 豆瓣 /new_subject 第一步页结构（书名 + ISBN，无副标题），用于第一步回填验证。 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>添加书籍</title></head>
<body>
<div id="content">
  <h1>添加书籍</h1>
  <div class="grid-16-8 clearfix">
    <div class="article">
      <form action="/new_subject" method="POST" class="detail_form" enctype="multipart/form-data">
        <fieldset>
          <div class="item basic ">
            <label for="p_title">书名</label>
            <input type="text" id="p_title" name="p_title" value="Sapiens" class="input_basic" maxlength="256" autocomplete="off">
            <input type="hidden" name="p_title">
          </div>
          <div class="item basic ">
            <label for="uid">ISBN</label>
            <input type="text" id="uid" name="p_uid" value="" class="input_basic" maxlength="256" autocomplete="off">
            <input type="hidden" id="is_isbn_copy" name="is_isbn_copy" value="0">
          </div>
          <div class="item">
            <label>&nbsp;</label>
            <input type="hidden" name="search_text" value="Sapiens">
            <input type="hidden" name="cat" value="1001">
            <input type="submit" name="subject_submit" value="下一步" class="submit"> <a href="/">取消</a>
          </div>
        </fieldset>
      </form>
    </div>
  </div>
</div>
</body>
</html>
